<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Lab Assistant — Virtual Lab, 2D Simulator & 62 Equipment Database</title>
    <meta name="description" content="AI-Powered Smart Lab Equipment Assistant featuring 15 interactive virtual experiments, 8-setup 2D laboratory simulator, 62 chemistry equipment ground truth database, AR vision scanner, quizzes, and Gemini AI voice assistant." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <!-- App Navigation Header -->
    <header class="app-header">
      <div class="brand-wrapper">
        <div class="brand-logo-icon">⚗️</div>
        <div>
          <span class="brand-title">Smart Lab Assistant</span>
          <span class="brand-badge">Tech Elevate • Unified Platform</span>
        </div>
      </div>

      <!-- Module Navigation Tabs -->
      <nav class="nav-tabs" aria-label="Experiment and Tool Selection">
        <button class="nav-tab-btn active" data-tab="experiments" id="tab-btn-experiments">
          <span>🔬</span> Virtual Lab (15 Experiments)
        </button>
        <button class="nav-tab-btn" data-tab="simulator" id="tab-btn-simulator">
          <span>⚗️</span> 2D Lab Simulator
        </button>
        <button class="nav-tab-btn" data-tab="equipment" id="tab-btn-equipment">
          <span>🔍</span> 62 Equipment Database
        </button>
        <button class="nav-tab-btn" data-tab="ar-quiz" id="tab-btn-ar-quiz">
          <span>📷</span> AR Lab & Quizzes
        </button>
        <button class="nav-tab-btn" data-tab="chat" id="tab-btn-chat">
          <span>🤖</span> AI Lab Assistant
        </button>
      </nav>
    </header>

    <!-- Main Dynamic Application Container -->
    <main class="app-main" id="view-root">
      <!-- Injected dynamically by main.js -->
    </main>

    <!-- Footer with Safety & Team Info -->
    <footer class="app-footer">
      <div>
        <strong>AI-Powered Smart Lab Equipment Assistant</strong> • Tech Elevate UNEMPLOYED 004
      </div>
      <div class="footer-tags">
        <span class="footer-tag">62 Chemistry Lab Tools</span>
        <span class="footer-tag">8 2D Simulation Setups</span>
        <span class="footer-tag">15 Virtual Experiments</span>
        <span class="footer-tag">AI Vision Scanner</span>
        <span class="footer-tag">63 Equipment Quizzes</span>
        <span class="footer-tag">Gemini AI Assistant</span>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
