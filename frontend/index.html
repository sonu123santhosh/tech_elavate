<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Smart Lab Assistant — Virtual Lab, 2D Simulator & AI Equipment Scanner</title>
    <meta name="description" content="AI-Powered Smart Lab Equipment Assistant featuring Teachable Machine live camera & document equipment scanner, 15 virtual experiments, 8-setup 2D laboratory simulator, and 62 equipment database." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

    <!-- Google Teachable Machine & TensorFlow.js SDKs -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>
  </head>
  <body>
    <!-- App Navigation Header -->
    <header class="app-header">
      <div class="brand-wrapper">
        <div class="brand-logo-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor">
            <path d="M19 19c0 .55-.45 1-1 1s-1-.45-1-1v-4.18l-3.32-5.54C13.24 9.55 13 8.79 13 8V4h1c.55 0 1-.45 1-1s-.45-1-1-1H10c-.55 0-1 .45-1 1s.45 1 1 1h1v4c0 .79-.24 1.55-.68 2.28L7 14.82V19c0 .55-.45 1-1 1s-1-.45-1-1c0-.28.11-.53.29-.71l4.42-7.37C10.23 9.94 10.5 8.99 10.5 8V4h3v4c0 .99.27 1.94.79 2.92l4.42 7.37c.18.18.29.43.29.71z"/>
          </svg>
        </div>
        <div>
          <span class="brand-title">Smart Lab Assistant</span>
          <span class="brand-badge">Tech Elevate • Unified Platform</span>
        </div>
      </div>

      <!-- Module Navigation Tabs -->
      <nav class="nav-tabs" aria-label="Experiment and Tool Selection">
        <button class="nav-tab-btn active" data-tab="experiments" id="tab-btn-experiments">
          Virtual Lab (15 Experiments)
        </button>
        <button class="nav-tab-btn" data-tab="scanner" id="tab-btn-scanner">
          AI Equipment Scanner
        </button>
        <button class="nav-tab-btn" data-tab="simulator" id="tab-btn-simulator">
          2D Lab Simulator
        </button>
        <button class="nav-tab-btn" data-tab="equipment" id="tab-btn-equipment">
          62 Equipment Database
        </button>
        <button class="nav-tab-btn" data-tab="ar-quiz" id="tab-btn-ar-quiz">
          AR Lab & Quizzes
        </button>
        <button class="nav-tab-btn" data-tab="chat" id="tab-btn-chat">
          AI Lab Assistant
        </button>
      </nav>
    </header>

    <!-- Main Dynamic Application Container -->
    <main class="app-main" id="view-root">
      <!-- Injected dynamically by main.js -->
    </main>

    <!-- Footer with Safety & Team Info -->
    <footer class="app-footer">
      <div>
        <strong>AI-Powered Smart Lab Equipment Assistant</strong> • Tech Elevate UNEMPLOYED 004
      </div>
      <div class="footer-tags">
        <span class="footer-tag">Teachable Machine AI (BlF4tNf8j)</span>
        <span class="footer-tag">Camera & Document Scanner</span>
        <span class="footer-tag">62 Chemistry Lab Tools</span>
        <span class="footer-tag">8 2D Simulation Setups</span>
        <span class="footer-tag">15 Virtual Experiments</span>
        <span class="footer-tag">Gemini AI Assistant</span>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
