<div class="app-layout">
  <!-- Top Global Sticky Navbar -->
  <app-navbar (toggleSidebar)="toggleSidebar()"></app-navbar>

  <div class="app-body">
    <!-- Left Sidebar (Collapsible & Mobile Drawer) -->
    <app-sidebar 
      [isCollapsed]="isSidebarCollapsed" 
      [isMobileOpen]="isMobileMenuOpen"
      (closeMobile)="closeMobileMenu()"
      (toggleCollapse)="toggleCollapse()">
    </app-sidebar>

    <!-- Main Content Area -->
    <main class="main-content" [class.sidebar-collapsed]="isSidebarCollapsed">
      <div class="content-wrapper">
        <router-outlet></router-outlet>
      </div>

      <!-- Professional University Lab Footer -->
      <footer class="app-footer">
        <div class="footer-left">
          <span class="footer-brand">SmartLab AI</span>
          <span class="footer-copy">&copy; 2026 Developed by <strong>UNEMPLOYED 004</strong> for Tech Elevate Hackathon.</span>
        </div>
        <div class="footer-right">
          <span class="badge badge-teal">Academic Demo Edition</span>
          <span class="footer-offline-status">100% Client-Side Ready &bull; Gemini API Slot Enabled</span>
        </div>
      </footer>
    </main>
  </div>
</div>
