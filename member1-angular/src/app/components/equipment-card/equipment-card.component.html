<div class="equipment-card" (click)="onCardClick()" tabindex="0" (keydown.enter)="onCardClick()">
  <!-- Top badge & favorite -->
  <div class="card-top">
    <span class="badge badge-teal">{{ equipment.categoryLabel }}</span>
    <button 
      class="card-fav-btn" 
      [class.active]="isFavorite()" 
      (click)="toggleFavorite($event)" 
      [title]="isFavorite() ? 'Remove from favorites' : 'Add to favorites'"
      aria-label="Toggle favorite">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
      </svg>
    </button>
  </div>

  <!-- Icon preview -->
  <div class="card-icon-frame" [innerHTML]="equipment.iconSvg"></div>

  <!-- Content -->
  <div class="card-content">
    <h3 class="card-title">{{ equipment.name }}</h3>
    <p class="card-tagline">{{ equipment.tagline }}</p>
    
    <div class="card-spec-pill" *ngIf="equipment.specifications.length > 0">
      <span class="pill-dot"></span>
      <span class="pill-text">{{ equipment.specifications[0].label }}: {{ equipment.specifications[0].value }}</span>
    </div>
  </div>

  <!-- Footer Actions -->
  <div class="card-footer">
    <button class="btn btn-outline btn-sm" (click)="onCardClick()">
      View Dossier
    </button>
    <button class="btn-icon-scan" (click)="onScanClick($event)" title="Simulate AI scan for this item">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
        <circle cx="12" cy="13" r="4"></circle>
      </svg>
    </button>
  </div>
</div>
